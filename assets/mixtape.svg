<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Mixtape: a cassette tape. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#23262e"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb43a"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
  </defs>

  <!-- Shell -->
  <rect x="16" y="48" width="224" height="160" rx="20" fill="url(#body)"/>
  <rect x="16" y="48" width="224" height="160" rx="20" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="30" cy="62" r="4" fill="#15171c"/>
  <circle cx="226" cy="62" r="4" fill="#15171c"/>
  <circle cx="30" cy="194" r="4" fill="#15171c"/>
  <circle cx="226" cy="194" r="4" fill="#15171c"/>

  <!-- Label -->
  <rect x="34" y="62" width="188" height="96" rx="10" fill="url(#label)"/>
  <rect x="48" y="72" width="104" height="6" rx="3" fill="#fff" fill-opacity=".85"/>
  <rect x="48" y="84" width="64" height="5" rx="2.5" fill="#fff" fill-opacity=".55"/>

  <!-- Tape window -->
  <rect x="58" y="98" width="140" height="48" rx="24" fill="#15171c"/>
  <rect x="98" y="108" width="60" height="28" rx="4" fill="#5b3a29"/>

  <!-- Reels -->
  <g fill="#f4f1ea">
    <circle cx="82" cy="122" r="17"/>
    <circle cx="174" cy="122" r="17"/>
  </g>
  <g fill="#15171c">
    <circle cx="82" cy="122" r="7"/>
    <circle cx="174" cy="122" r="7"/>
    <rect x="80" y="106" width="4" height="8" rx="1"/>
    <rect x="80" y="130" width="4" height="8" rx="1"/>
    <rect x="66" y="120" width="8" height="4" rx="1"/>
    <rect x="90" y="120" width="8" height="4" rx="1"/>
    <rect x="172" y="106" width="4" height="8" rx="1"/>
    <rect x="172" y="130" width="4" height="8" rx="1"/>
    <rect x="158" y="120" width="8" height="4" rx="1"/>
    <rect x="182" y="120" width="8" height="4" rx="1"/>
  </g>

  <!-- Bottom tab -->
  <path d="M64 208 L76 170 H180 L192 208 Z" fill="#2c3039"/>
  <circle cx="100" cy="190" r="6" fill="#15171c"/>
  <circle cx="156" cy="190" r="6" fill="#15171c"/>
  <rect x="120" y="184" width="16" height="12" rx="2" fill="#15171c"/>
</svg>
