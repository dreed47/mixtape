[package]
name = "mixtape"
version = "0.8.0"
edition = "2024"
description = "Search YouTube Music, download songs as MP3 into an Artist/Album library, and play folders"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dreed47/mixtape"

[dependencies]
eframe = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["file", "http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = "0.36"
